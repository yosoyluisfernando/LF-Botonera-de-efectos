[package]
name = "tauri-app"
version = "1.6.0-beta.3"
description = "LF Botonera de Efectos — botonera de sonido para locutores y radio"
authors = ["Luis Fernando Velásquez"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/yosoyluisfernando/LF-Botonera-de-efectos"
repository = "https://github.com/yosoyluisfernando/LF-Botonera-de-efectos"
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.19.0", features = ["symphonia-all"] }
symphonia = "0.5.5"
opus-decoder = "0.1.1"
tauri-plugin-dialog = "2.7.1"
lofty = "0.22"
ureq = { version = "2", features = ["json"] }
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
ebur128 = "0.1"
thiserror = "2"
unicode-normalization = "0.1"
notify = "8.2"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
httparse = "1"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-global-shortcut = "2.3.2"

[target."cfg(target_os = \"windows\")".dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Media_Audio", "Win32_Foundation"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
btleplug = "=0.11.8"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "sync", "time"] }
uuid = "1"

[target."cfg(target_os = \"linux\")".dependencies]
midir = "0.11"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17.2"
tauri-plugin-window-state = "2"
tauri-plugin-drag = "=2.1.1"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "=0.1.1"
sha2 = "0.10"
tauri-plugin-fs = "=2.5.1"
