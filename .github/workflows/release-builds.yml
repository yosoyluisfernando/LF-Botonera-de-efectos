name: Release builds

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: Release tag to upload assets to
        required: true
      checkoutRef:
        description: Git ref to build
        required: true
      target:
        description: Platforms to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
      publish:
        description: Replace assets in the selected release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.target == 'linux' && '["ubuntu-22.04"]' || inputs.target == 'windows' && '["windows-latest"]' || '["windows-latest","ubuntu-22.04"]') }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkoutRef }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri bundles (Linux)
        if: runner.os == 'Linux'
        run: npm run tauri build -- --bundles deb,appimage,rpm

      - name: Build Tauri bundles (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis,msi

      - name: Preserve Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          compression-level: 0
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

      - name: Preserve Windows bundles
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          compression-level: 0
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Linux assets
        if: runner.os == 'Linux' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tagName }}
        shell: bash
        run: |
          find src-tauri/target/release/bundle -type f \
            \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) \
            -print0 | xargs -0 -I{} gh release upload "$TAG_NAME" "{}" --clobber

      - name: Upload Windows assets
        if: runner.os == 'Windows' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tagName }}
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            ForEach-Object { gh release upload $env:TAG_NAME $_.FullName --clobber }
