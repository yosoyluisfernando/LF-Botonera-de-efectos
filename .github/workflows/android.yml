name: Android ARM64 de prueba
on:
  push:
    branches: [codex/android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Android SDK and NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if ! command -v sdkmanager >/dev/null; then
            curl --fail --silent --show-error --location --retry 3 \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
              --output "$RUNNER_TEMP/android-tools.zip"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
            mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/lf-ci"
            export PATH="$ANDROID_HOME/cmdline-tools/lf-ci/bin:$PATH"
            echo "$ANDROID_HOME/cmdline-tools/lf-ci/bin" >> "$GITHUB_PATH"
          fi
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'platforms;android-35' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-aarch64
          cache-on-failure: true
      - run: npm ci
      - run: node --test scripts/mobile-locales.test.mjs scripts/touch-controls.test.mjs
      - run: npm run tauri -- android init --ci --skip-targets-install
      - name: Apply the LF launcher icon
        run: |
          res=src-tauri/gen/android/app/src/main/res
          cp -R src-tauri/icons/android/. "$res/"
          cp "$res/mipmap-anydpi-v26/ic_launcher.xml" "$res/mipmap-anydpi-v26/ic_launcher_round.xml"
      - run: npm run tauri -- android build --ci --debug --apk --target aarch64
      - name: Verify and stage APK
        run: |
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "${apks[0]}"
          mkdir -p android-artifact
          cp "${apks[0]}" android-artifact/LF-Botonera-1.5.0-android-arm64-debug.apk
          cd android-artifact
          sha256sum *.apk > LF-Botonera-1.5.0-android-arm64-debug.apk.sha256
      - name: Install and launch the ARM64 APK on Android 35
        run: bash scripts/android-smoke.sh android-artifact/LF-Botonera-1.5.0-android-arm64-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LF-Botonera-Android-startup-logs
          path: android-smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: LF-Botonera-Android-ARM64-debug
          path: android-artifact/
          if-no-files-found: error
